name: semantic-lint

on:
  push:
    branches: ["main", "develop"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MERMAN_CLI_VERSION: "0.7.0"
    steps:
      - uses: actions/checkout@v7
        with:
          # Later steps run pull-request-controlled scripts that need no Git token.
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"
      # uv provides uvx, which `bun semantic` uses to run semgrep.
      # astral-sh/setup-uv v10.1.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - run: bun install --frozen-lockfile
      - name: Install mdtablefix
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@d0c2585d9e144775e4ec9fe26e7eeb03c14844dd
        with:
          version: "0.6.1"
      - run: make check-fmt
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'
      - run: bun semantic
      - name: Enforce en-GB-oxendict spelling
        run: make spelling
      - name: Install diagram tooling
        run: |
          set -euxo pipefail
          rustup toolchain install 1.95.0 --profile minimal
          uv tool install --python 3.14 nixie-cli==1.1.0
          cargo +1.95.0 install merman-cli \
            --version "=${MERMAN_CLI_VERSION}" --locked
      - name: Validate diagrams
        run: make nixie
      # Runs the workflow contract here as well as in `build-test`, so
      # deleting `build-test` still fails a check that runs.
      - name: Validate workflow contracts
        run: bun test tests/semantic-lint-workflow.test.ts tests/build-test-workflow.test.ts

  # Builds the site and runs the test suite on every pull request, so a
  # change that breaks either (including a Dependabot bump that automerge
  # would otherwise land) turns the required `build-test` check red.
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The build and tests run dependency code that needs no Git token.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: "latest"
      - run: bun install --frozen-lockfile
      - run: bun run tokens:build
      - run: bun run build
      - run: bun run test
